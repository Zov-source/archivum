<\!DOCTYPE html\>
<html lang="ja"\>
<head\>
  <meta charset="UTF\-8"\>
  <meta name="viewport" content="width=device\-width, initial\-scale=1\.0"\>
  <title\>Alwin — ARCHIVUM</title\>
  <link rel="stylesheet" href="css/style\.css"\>
</head\>
<body\>

<header class="character\-header"\>
  <div class="container"\>
    <div class="character\-number"\>SPECIMEN A\-002 / HUMAN</div\>
  </div\>
</header\>

<main class="container"\>
  <section class="character\-content"\>

    <\!\-\- Character Images \-\-\>
    <div class="character\-gallery"\>
      <button class="gallery\-button gallery\-prev"
        onclick="changeImage&#40;\-1&#41;" aria\-label="前の画像"\>
        &lt;
      </button\>

      <div class="gallery\-image"\>
        <img
          id="character\-image"
          src="character\-002\.jpg"
          alt="Alwin Kreuz"
        \>
      </div\>

      <button class="gallery\-button gallery\-next"
        onclick="changeImage&#40;1&#41;" aria\-label="次の画像"\>
        &gt;
      </button\>
    </div\>

    <\!\-\- Character Profile \-\-\>
    <div class="character\-record"\>

      <h1 class="character\-title"\>Alwin</h1\>

      <div class="tags"\>
        <span class="tag"\>\#HUMAN</span\>
        <span class="tag"\>\#MALE</span\>
        <span class="tag"\>\#うちよそ</span\>
      </div\>
<div class="profile-table">

  <div class="profile-row">
    <span class="profile-label">Name</span>
    <span class="profile-value">
      Alwin Kreuz<br>
      <span style="color: var(--paper-dark); font-size: 0.75rem;">アルヴィン・クロイツ</span>
    </span>
  </div>

  <div class="profile-row">
    <span class="profile-label">Age</span>
    <span class="profile-value">38</span>
  </div>

  <div class="profile-row">
    <span class="profile-label">Gender</span>
    <span class="profile-value">Male</span>
  </div>

  <div class="profile-row">
    <span class="profile-label">Height</span>
    <span class="profile-value">196 cm</span>
  </div>

  <div class="profile-row">
    <span class="profile-label">Weight</span>
    <span class="profile-value">98 kg</span>
  </div>

  <div class="profile-row">
    <span class="profile-label">Species</span>
    <span class="profile-value">Human</span>
  </div>

  <div class="profile-row">

  <div class="profile-row">

  </div>

</div>
