<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>榊 真紘 — ARCHIVUM</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="character-header">
  <div class="container">
    <div class="character-number">SPECIMEN A-001</div>
  </div>
</header>

<main class="container">

  <section class="character-content">

   <div class="character-gallery">

  <button class="gallery-button gallery-prev" onclick="changeImage(-1)">
    &lt;
  </button>

 <div class="gallery-image">
  <img id="character-image" src="character-001.jpg" alt="Character 001">
</div>

  <button class="gallery-button gallery-next" onclick="changeImage(1)">
    &gt;
  </button>

</div>

    <div class="character-record">

      <h1 class="character-title">真紘</h1>

      <div class="profile-table">

        <div class="profile-row">
          <span class="profile-label">Name</span>
          <span class="profile-value">榊 真紘</span>
        </div>

        <div class="profile-row">
          <span class="profile-label">Age</span>
          <span class="profile-value">32</span>
        </div>

        <div class="profile-row">
          <span class="profile-label">Gender</span>
          <span class="profile-value">Male</span>
        </div>

        <div class="profile-row">
          <span class="profile-label">Height</span>
          <span class="profile-value">172 cm</span>
        </div>

        <div class="profile-row">
          <span class="profile-label">Weight</span>
          <span class="profile-value">55 kg</span>
        </div>

        <div class="profile-row">
          <span class="profile-label">Species</span>
          <span class="profile-value">Human</span>
        </div>

        <div class="profile-row">
          <span class="profile-label">Occupation</span>
          <span class="profile-value">Literary Translator</span>
        </div>

        <div class="profile-row">
          <span class="profile-label">Birthday</span>
          <span class="profile-value">01 / 09</span>
        </div>

        <div class="profile-row">
          <span class="profile-label">Personality</span>
          <span class="profile-value">Calm and reserved.</span>
        </div>

        <div class="profile-row">
          <span class="profile-label">Like</span>
          <span class="profile-value">Books, tea, quiet places.</span>
        </div>

        <div class="profile-row">
          <span class="profile-label">Dislike</span>
          <span class="profile-value">Noise, disorder.</span>
        </div>

      </div>

      <div class="color-palette">
        <span style="background:#21201E;"></span>
        <span style="background:#706E6C;"></span>
        <span style="background:#665447;"></span>
      </div>

    </div>

  </section>

  <a href="index.html" class="back-index">BACK TO INDEX</a>

</main>

<footer class="site-footer">
  ARCHIVUM / PRIVATE COLLECTION
</footer>
  
<script>
const images = [
  "character-001.jpg",
  "character-001-2.jpg",
  "character-001-3.jpg",
  "character-001-4.jpg",
  "character-001-5.jpg"
];

let currentImage = 0;

function changeImage(direction) {
  currentImage += direction;

  if (currentImage < 0) {
    currentImage = images.length - 1;
  }

  if (currentImage >= images.length) {
    currentImage = 0;
  }

  document.getElementById("character-image").src = images[currentImage];
}
</script>
</body>
</html>
